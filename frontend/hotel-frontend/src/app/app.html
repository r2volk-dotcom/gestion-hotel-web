<!-- contenedor aside: sidebar fijo a la izquierda -->
<aside class="sidebar">

  <!-- header del sidebar con logo -->
  <div class="sidebar-header">
    <!-- contenedor del logo: icono + texto -->
    <div class="sidebar-logo">
      <!-- icono del logo en SVG -->
      <div class="logo-icon">
        <!-- SVG de edificio/hotel -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <!-- texto del logo -->
      <span class="logo-text">Hotel</span>
    </div>
  </div>

  <!-- navegacion principal del sidebar -->
  <nav class="sidebar-nav">
    <!-- etiqueta de seccion -->
    <p class="nav-label">Gestión</p>

    <!-- link a Habitaciones: routerLink navega, routerLinkActive marca como activo -->
    <a routerLink="/habitaciones" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de casa -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      Habitaciones
    </a>

    <!-- link a Clientes -->
    <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de persona -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
      </svg>
      Clientes
    </a>

    <!-- link a Reservas -->
    <a routerLink="/reservas" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de calendario -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Reservas
    </a>

    <!-- etiqueta de segunda seccion -->
    <p class="nav-label" style="margin-top: 20px">Otros</p>

    <!-- link a Reportes -->
    <a routerLink="/reportes" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de grafico de barras -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      Reportes
    </a>

    <!-- link a Pagos -->
    <a routerLink="/pagos" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de tarjeta de credito -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="4" width="22" height="16" rx="2"/>
        <line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
      Pagos
    </a>

    <!-- link a Empleados -->
    <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de grupo de personas -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Empleados
    </a>

    <!-- link a Configuracion -->
    <a routerLink="/configuracion" routerLinkActive="active" class="nav-item">
      ⚙️ Configuración
    </a>

    <!-- link a Historial -->
    <a routerLink="/historial" routerLinkActive="active" class="nav-item">
      <!-- icono SVG de documento -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Historial
    </a>

  </nav>

  <!-- footer del sidebar con info del usuario -->
  <div class="sidebar-footer">
    <!-- contenedor del usuario -->
    <div class="sidebar-user">
      <!-- avatar circular con iniciales -->
      <div class="user-avatar">SH</div>
      <!-- info del usuario: nombre y rol -->
      <div class="user-info">
        <p class="user-name">Sistema Hotelero</p>
        <p class="user-role">Administrador</p>
      </div>
    </div>
  </div>

</aside>

<!-- contenedor principal: topbar + contenido de rutas -->
<div class="main-wrapper">
  <!-- barra superior con titulo de pagina -->
  <header class="topbar">
    <!-- contenedor del titulo y subtitulo -->
    <div class="topbar-left">
      <h1 class="page-title">Sistema Hotelero</h1>
      <span class="page-subtitle">Panel de administración</span>
    </div>
  </header>

  <!-- area donde se renderiza el componente de la ruta activa -->
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
