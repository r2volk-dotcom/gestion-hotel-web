<!-- layout principal: sidebar fijo a la izquierda + contenido a la derecha -->
<aside class="sidebar">

  <!-- logo -->
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <span class="logo-text">Hotel</span>
    </div>
  </div>

  <!-- navegación -->
  <nav class="sidebar-nav">
    <p class="nav-label">Gestión</p>

    <!-- routerLink navega a la ruta, routerLinkActive agrega clase "active" cuando esa ruta está activa -->
    <a routerLink="/habitaciones" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      Habitaciones
    </a>

    <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
      </svg>
      Clientes
    </a>

    <a routerLink="/reservas" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Reservas
    </a>

    <!-- sección de pestañas en blanco para completar después -->
    <p class="nav-label" style="margin-top: 20px">Otros</p>

    <a routerLink="/reportes" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      Reportes
    </a>

    <a routerLink="/pagos" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="4" width="22" height="16" rx="2"/>
        <line x1="1" y1="10" x2="23" y2="10"/>
      </svg>
      Pagos
    </a>

    <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      Empleados
    </a>

    <a routerLink="/configuracion" routerLinkActive="active" class="nav-item">
      ⚙️ Configuración
    </a>

    <a routerLink="/historial" routerLinkActive="active" class="nav-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      Historial
    </a>

  </nav>

  <!-- usuario al fondo del sidebar -->
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar">SH</div>
      <div class="user-info">
        <p class="user-name">Sistema Hotelero</p>
        <p class="user-role">Administrador</p>
      </div>
    </div>
  </div>

</aside>

<!-- área principal: topbar arriba + contenido debajo -->
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="page-title">Sistema Hotelero</h1>
      <span class="page-subtitle">Panel de administración</span>
    </div>
  </header>

  <!-- router-outlet renderiza el componente de la ruta activa -->
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
