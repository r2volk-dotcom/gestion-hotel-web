<!-- gestion de promociones -->
<div class="grid-placeholder">
  <div class="placeholder-header">
    <h3>Espacio Personalizado</h3>
  </div>
  <div class="placeholder-body">
  </div>
    <div class="servicios-section">
      <div class="servicios-widget">
        <table class="servicios-tabla">
          <thead>
            <tr>
              <th>Promociones</th>
              <th class="col-toggle">Activar</th>
            </tr>
          </thead>
          <tbody>
              @for (promocion of promocionesDisponibles; track promocion.id) {
                <tr>
                  <td>{{ promocion.nombre }}</td>
                  <td class="col-toggle">
                    <label class="toggle">
                      <input type="checkbox"
                             {{ promocion.nombre }}
                            (change)="onTogglePromocion(promocion.id!)">
                      <span class="toggle-slider"></span>
                    </label>
                  </td>
                </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
</div>
