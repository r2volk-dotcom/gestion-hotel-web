<!-- fila superior con grafico, promociones y servicios -->
<div class="top-row">
  <!-- grafico de habitaciones -->
  <app-grafico-habitaciones [habitaciones]="habitaciones"></app-grafico-habitaciones>

  <!-- gestion de promociones -->
  <app-gestion-promociones (promocionesCambiar)="actualizarPromociones()"></app-gestion-promociones>

  <!-- gestion de servicios -->
  <app-gestion-servicios (serviciosCambiar)="panelHabitaciones.cargarServicios()"></app-gestion-servicios>
</div>

<!-- seccion inferior con el panel de administracion -->
<app-panel-habitaciones
  #panelHabitaciones
  [habitaciones]="habitaciones"
  (habitacionesCambiar)="cargarHabitaciones()">
</app-panel-habitaciones>
