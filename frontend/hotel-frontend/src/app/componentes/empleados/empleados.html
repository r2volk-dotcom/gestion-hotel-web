<!-- Cabecera de la pagina -->
<div class="page-header-widget">
  <span class="kicker">Gestión hotelera</span>
  <h2>Empleados</h2>
</div>

<!-- Contenedor grid de widgets separados -->
<div class="empleados-grid-container">
  
  <!-- Widget A: Formulario de registro (rectangulo vertical) -->
  <div class="widget-card widget-formulario">
    <app-registro-empleado
      [empleado]="empleadoForm"
      [editando]="editando"
      (empleadoGuardar)="guardar($event)"
      (empleadoCancelar)="limpiarFormulario()">
    </app-registro-empleado>
  </div>

  <!-- Widget B: Tabla de empleados (rectangulo horizontal) -->
  <div class="widget-card widget-tabla">
    <app-tabla-empleados
      [empleados]="empleados"
      (empleadoEditar)="seleccionarParaEditar($event)"
      (empleadoEliminar)="eliminar($event)">
    </app-tabla-empleados>
  </div>

</div>
