<!-- Formulario de registro y edicion de empleados -->
<div class="form-container">
  <h3>{{ editando ? 'Editar Empleado' : 'Registrar Empleado' }}</h3>
  
  <div class="form-field-vertical">
    <input type="text" placeholder="Nombre" [(ngModel)]="empleado.nombre">
  </div>
  
  <div class="form-field-vertical">
    <input type="text" placeholder="Apellido" [(ngModel)]="empleado.apellido">
  </div>
  
  <div class="form-field-vertical">
    <input type="text" placeholder="Usuario" [(ngModel)]="empleado.usuario">
  </div>
  
  <div class="form-field-vertical">
    <input type="password" placeholder="Contraseña" [(ngModel)]="empleado.contrasena">
  </div>

  <div class="grid-item imagen-field-container">
    <!-- click ejecuta la seleccion de archivo -->
    <button type="button" class="btn-image" (click)="imagenInput.click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px; vertical-align: middle;">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      + Imagen
    </button>
    <!-- input oculto para subir imagen -->
    <input type="file" #imagenInput accept="image/png" (change)="onFileSelected($event)" hidden>
    
    <!-- muestra el nombre del archivo seleccionado -->
    @if (nombreImagen) {
      <div class="imagen-nombre-wrapper">
        <span class="imagen-nombre">✓ {{ nombreImagen }}</span>
      </div>
    }
  </div>
  
  <div class="form-field-vertical">
    <select [(ngModel)]="empleado.rol">
      <option value="" disabled selected>Selecciona un rol</option>
      <option value="Administrador">Administrador</option>
      <option value="Recepcionista">Recepcionista</option>
    </select>
  </div>
  
  <!-- Acciones del formulario -->
  <div class="form-actions-row">
    <button class="btn-primary" (click)="guardar()">
      {{ editando ? 'Actualizar' : 'Guardar' }}
    </button>
    <button class="btn-secondary" (click)="cancelar()">
      Cancelar
    </button>
  </div>
</div>
