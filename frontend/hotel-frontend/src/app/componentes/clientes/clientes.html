<!-- seccion principal del componente Clientes -->
<section class="section">
  <!-- header de la seccion con titulo -->
  <div class="section-header">
    <h2>Clientes</h2>
  </div>

  <!-- Componente Formulario de Registro y Búsqueda -->
  <app-formulario-cliente
    (clienteGuardar)="guardarCliente($event)"
    (clienteBuscar)="buscarClientes($event)">
  </app-formulario-cliente>

  <!-- Componente Tabla de Listados -->
  <app-tabla-clientes
    [clientes]="clientes"
    [clientesBuscados]="clientesBuscados"
    (clienteEliminar)="eliminarCliente($event)">
  </app-tabla-clientes>
</section>
