<!-- seccion principal de clientes -->
<section class="section">
  
  <!-- header con titulo -->
  <div class="section-header">
    <h2>Clientes</h2>
  </div>

  <!-- formulario de registro y busqueda -->
  <app-formulario-cliente
    (clienteGuardar)="guardarCliente($event)"
    (clienteBuscar)="buscarClientes($event)">
  </app-formulario-cliente>

  <!-- tabla de listados -->
  <app-tabla-clientes
    [clientes]="clientes"
    [clientesBuscados]="clientesBuscados"
    (clienteEliminar)="eliminarCliente($event)">
  </app-tabla-clientes>
</section>
