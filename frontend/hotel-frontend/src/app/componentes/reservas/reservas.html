<!-- seccion principal del componente Reservas -->
<section class="section">
  <!-- header de la seccion con titulo -->
  <div class="section-header">
    <h2>Reservas</h2>
  </div>

  <!-- Componente Formulario de Registro -->
  <app-formulario-reserva
    [clientes]="clientes"
    [habitaciones]="habitaciones"
    (reservaGuardar)="guardarReserva($event)">
  </app-formulario-reserva>

  <!-- Componente Lista de Reservas -->
  <app-lista-reservas
    [reservas]="reservas"
    [clientes]="clientes"
    [habitaciones]="habitaciones"
    (reservaEliminar)="eliminarReserva($event)"
    (reservaEditarEstado)="editarEstado($event)">
  </app-lista-reservas>
</section>
