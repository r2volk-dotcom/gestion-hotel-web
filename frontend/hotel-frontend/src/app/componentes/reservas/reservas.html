<!-- seccion principal de reservas -->
<section class="section">
  
  <!-- header con titulo -->
  <div class="section-header">
    <h2>Reservas</h2>
  </div>

  <!-- formulario de registro -->
  @if (usuarioActivo){
    <app-formulario-reserva
      [clientes]="clientes"
      [habitaciones]="habitaciones"
      [empleados]="empleados"
      [usuarioActivo]="usuarioActivo"
      (reservaGuardar)="guardarReserva($event)">
    </app-formulario-reserva>
  }

  <!-- lista de reservas -->
  <app-lista-reservas
    [reservas]="reservas"
    [clientes]="clientes"
    [habitaciones]="habitaciones"
    [empleados]="empleados"
    [usuarioActivo]="usuarioActivo"
    (reservaEliminar)="eliminarReserva($event)"
    (reservaEditarEstado)="editarEstado($event)">
  </app-lista-reservas>
</section>
