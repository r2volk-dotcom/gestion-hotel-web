<!-- seccion del formulario para registrar reserva -->
<div class="form-section">
  <!-- titulo de la seccion del formulario -->
  <h3>Registrar reserva</h3>

  <!-- grid de campos del formulario -->
  <div class="form-grid">
    <!-- select de cliente con two-way binding al modelo -->
    <select [(ngModel)]="nuevaReserva.clienteId">
      <!-- opcion por defecto con valor 0 (ningun cliente) -->
      <option [ngValue]="0">Seleccione cliente</option>
      <!-- repite una opcion por cada cliente en el array -->
      @for (cliente of clientes; track cliente.id) {
      <option [ngValue]="cliente.id">
        {{ cliente.nombre }} {{ cliente.apellido }}
      </option>
      }
    </select>

    <!-- select de habitacion con two-way binding al modelo -->
    <select [(ngModel)]="nuevaReserva.habitacionId">
      <!-- opcion por defecto con valor 0 (ninguna habitacion) -->
      <option [ngValue]="0">Seleccione habitacion</option>
      <!-- repite una opcion por cada habitacion en el array -->
      @for (habitacion of habitaciones; track habitacion.id) {
      <option [ngValue]="habitacion.id">
        {{ habitacion.tipo }} - S/ {{ habitacion.precio }}
      </option>
      }
    </select>

    <!-- input de fecha de entrada con two-way binding -->
    <input type="date" [(ngModel)]="nuevaReserva.fechaEntrada">
    <!-- input de fecha de salida con two-way binding -->
    <input type="date" [(ngModel)]="nuevaReserva.fechaSalida">
  </div>

  <!-- contenedor de botones de accion -->
  <div class="form-actions">
    <!-- boton que ejecuta guardarReserva al hacer click -->
    <button class="btn btn-primary" (click)="guardar()">Guardar reserva</button>
  </div>
</div>
