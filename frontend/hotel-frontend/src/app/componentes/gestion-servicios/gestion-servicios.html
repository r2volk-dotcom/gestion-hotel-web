<section class="section">
  <div class="section-header">
    <h2>Gestión Servicios</h2>
  </div>

  <div class="form-section">
    <h3>Registrar servicio</h3>
    <div class="form-grid">
      <input type="text" placeholder="Nombre del servicio" [(ngModel)]="nuevoServicio">
      <div class="form-actions">
        <button class="btn btn-primary" (click)="guardarServicio()">Registrar Servicio</button>
      </div>
    </div>
  </div>

  <div class="list-section">
    <div class="list-header">
      <span>Lista de servicios</span>
    </div>
    @if (serviciosDisponibles.length > 0) {
      <table class="habitaciones-tabla">
        <thead>
          <tr>
            <th>#</th>
            <th>Servicio</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          @for (servicio of serviciosDisponibles; track servicio.id) {
            <tr>
              <td class="col-id">{{ servicio.id }}</td>
              <td>{{ servicio.nombre }}</td>
              <td>
                <button class="btn-delete" (click)="eliminarServicio(servicio.id!)">
                  <svg width="17" height="17" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6"/>
                    <path d="M14 11v6"/>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    } @else {
      <div class="empty-list">No hay servicios registrados</div>
    }
  </div>
</section>
