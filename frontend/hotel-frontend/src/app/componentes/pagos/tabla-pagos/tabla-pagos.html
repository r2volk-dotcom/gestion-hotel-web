@if (pagos.length > 0) {
  <div class="table-scroll">
    <table class="tabla-compleja">
      <thead>
        <tr>
          <th># Reserva</th>
          <th>Monto</th>
          <th>Método</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (pago of pagos; track pago.id) {
          <tr>
            <td>#{{ pago.reservaId }}</td>
            <td>S/ {{ pago.monto.toFixed(2) }}</td>
            <td>{{ pago.metodoPago || '—' }}</td>
            <td>
              <!-- Dibuja una etiqueta de color: verde si ya esta Pagado, o amarillo si aun esta Pendiente -->
              <span class="badge" [class.badge-pagado]="pago.estado === 'Pagado'" [class.badge-pendiente]="pago.estado === 'Pendiente'">
                {{ pago.estado }}
              </span>
            </td>
            <td>
              @if (pago.estado === 'Pendiente') {
                <button class="btn-pagar" (click)="pagar.emit(pago)">Pagar</button>
                <button class="btn-imprimir" disabled>Imprimir</button>
              } @else {
                <button class="btn-imprimir activo" (click)="imprimir.emit(pago)">Imprimir</button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <div class="empty-list">No hay pagos registrados</div>
}
